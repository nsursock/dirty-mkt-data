[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dirty-mkt-data"
version = "0.1.0"
description = "Synthetic financial market-data generator. Apple MLX only."
requires-python = ">=3.10"
dependencies = ["mlx>=0.32", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "plotly>=6", "kaleido>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"